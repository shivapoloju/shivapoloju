<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <!-- Definitions for gradients and filters -->
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b10" />
      <stop offset="50%" stop-color="#0f111a" />
      <stop offset="100%" stop-color="#151324" />
    </linearGradient>
    
    <!-- Accent Gradients -->
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glow-subtle" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Rect -->
  <rect width="850" height="320" rx="16" fill="url(#bgGrad)" stroke="#2d2a45" stroke-width="1.5"/>

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08">
    <path d="M 0,40 L 850,40 M 0,80 L 850,80 M 0,120 L 850,120 M 0,160 L 850,160 M 0,200 L 850,200 M 0,240 L 850,240 M 0,280 L 850,280" stroke="#8b5cf6" stroke-width="0.5" />
    <path d="M 50,0 L 50,320 M 100,0 L 100,320 M 150,0 L 150,320 M 200,0 L 200,320 M 250,0 L 250,320 M 300,0 L 300,320 M 350,0 L 350,320 M 400,0 L 400,320 M 450,0 L 450,320 M 500,0 L 500,320 M 550,0 L 550,320 M 600,0 L 600,320 M 650,0 L 650,320 M 700,0 L 700,320 M 750,0 L 750,320 M 800,0 L 800,320" stroke="#8b5cf6" stroke-width="0.5" />
  </g>

  <!-- Decorative Animated Circles in background -->
  <g opacity="0.25">
    <circle cx="750" cy="100" r="80" fill="none" stroke="url(#accent1)" stroke-width="1" stroke-dasharray="4 8">
      <animateTransform attributeName="transform" type="rotate" from="0 750 100" to="360 750 100" dur="20s" repeatCount="indefinite"/>
    </circle>
    <circle cx="750" cy="100" r="40" fill="none" stroke="url(#accent2)" stroke-width="1.5">
      <animate attributeName="r" values="35;45;35" dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.3;0.8;0.3" dur="4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="100" cy="220" r="60" fill="none" stroke="url(#accent2)" stroke-width="1" stroke-dasharray="3 6">
      <animateTransform attributeName="transform" type="rotate" from="360 100 220" to="0 100 220" dur="15s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Glowing tech lines -->
  <g opacity="0.4" stroke-linecap="round">
    <path d="M 50,50 L 150,50 L 180,80" fill="none" stroke="url(#accent1)" stroke-width="2" />
    <path d="M 800,270 L 700,270 L 670,240" fill="none" stroke="url(#accent2)" stroke-width="2" />
    <!-- Pulse along path -->
    <circle r="4" fill="#38bdf8" filter="url(#glow)">
      <animateMotion path="M 50,50 L 150,50 L 180,80" dur="3s" repeatCount="indefinite" rotate="auto"/>
    </circle>
    <circle r="4" fill="#f43f5e" filter="url(#glow)">
      <animateMotion path="M 800,270 L 700,270 L 670,240" dur="4s" repeatCount="indefinite" rotate="auto"/>
    </circle>
  </g>

  <!-- Content Group -->
  <g transform="translate(80, 0)">
    <!-- Tech Label -->
    <text x="0" y="90" fill="#a855f7" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="800" letter-spacing="4" filter="url(#glow-subtle)">
      CONSOLE.LOG(&quot;WELCOME TO MY SPACE&quot;);
    </text>

    <!-- Main Title -->
    <text x="0" y="155" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="2">
      SHIVA SAI POLOJU
      <animate attributeName="opacity" values="0.9;1;0.9" dur="3s" repeatCount="indefinite" />
    </text>

    <!-- Glowing Accent Underline -->
    <rect x="0" y="175" width="220" height="4" rx="2" fill="url(#accent1)" filter="url(#glow)">
      <animate attributeName="width" values="180;260;180" dur="4s" repeatCount="indefinite" />
    </rect>

    <!-- Subheading -->
    <text x="0" y="215" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="600" letter-spacing="1.5">
      Full Stack Developer &amp; GenAI Engineer
    </text>

    <!-- Description or Status -->
    <g transform="translate(0, 248)">
      <rect x="0" y="0" width="12" height="12" rx="3" fill="#10b981" filter="url(#glow)">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
      </rect>
      <text x="22" y="11" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1">
        CURRENTLY BUILDING DISASTER-RESILIENT AI TOOLS
      </text>
    </g>
  </g>
</svg>
